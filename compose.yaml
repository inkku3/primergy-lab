services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: php/Dockerfile
    networks:
      default:
        aliases:
          - php-service

  registry:
    image: registry:2
    ports:
      - "5000:5000"
