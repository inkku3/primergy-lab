name: Build PHP Site Images

on:
  push:
    branches:
      - main
    paths:
      - 'cluster/apps/php-site/**'
      - 'cluster/argocd/php-site.yaml'
      - '!cluster/apps/php-site/k8s/**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PHP_IMAGE: ghcr.io/inkku3/primergy-lab-php
  NGINX_IMAGE: ghcr.io/inkku3/primergy-lab-nginx

jobs:
  build:
    if: github.actor != 'argocd-image-updater'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PHP image (local)
        uses: docker/build-push-action@v6
        with:
          context: ./cluster/apps/php-site
          file: ./cluster/apps/php-site/php/Dockerfile
          load: true
          tags: ${{ env.PHP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=php
          cache-to: type=gha,scope=php,mode=max

      - name: Trivy scan PHP image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.PHP_IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Push PHP image
        uses: docker/build-push-action@v6
        with:
          context: ./cluster/apps/php-site
          file: ./cluster/apps/php-site/php/Dockerfile
          push: true
          tags: |
            ${{ env.PHP_IMAGE }}:${{ github.sha }}
            ${{ env.PHP_IMAGE }}:latest
          cache-from: type=gha,scope=php

      - name: Build Nginx image (local)
        uses: docker/build-push-action@v6
        with:
          context: ./cluster/apps/php-site
          file: ./cluster/apps/php-site/nginx/Dockerfile
          load: true
          tags: ${{ env.NGINX_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max

      - name: Trivy scan Nginx image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.NGINX_IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./cluster/apps/php-site
          file: ./cluster/apps/php-site/nginx/Dockerfile
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:${{ github.sha }}
            ${{ env.NGINX_IMAGE }}:latest
          cache-from: type=gha,scope=nginx

