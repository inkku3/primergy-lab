name: Build PHP Site Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PHP_IMAGE: ghcr.io/inkku3/primergy-lab-php
  NGINX_IMAGE: ghcr.io/inkku3/primergy-lab-nginx

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PHP image
        uses: docker/build-push-action@v6
        with:
          context: ./cluster/apps/php-site
          file: ./cluster/apps/php-site/php/Dockerfile
          push: true
          tags: ${{ env.PHP_IMAGE }}:${{ github.sha }}

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./cluster/apps/php-site
          file: ./cluster/apps/php-site/nginx/Dockerfile
          push: true
          tags: ${{ env.NGINX_IMAGE }}:${{ github.sha }}


