name: Trivy Repo Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  config-and-secrets:
    if: "!contains(github.event.head_commit.message, 'build: automatic update of')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Secret and dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: '0'
