name: Trivy Repo Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  config-and-secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Secret and dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: '0'

  scheduled-image-scan:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        image:
          - ghcr.io/inkku3/primergy-lab-php:latest
          - ghcr.io/inkku3/primergy-lab-nginx:latest

    steps:
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'