---
- name: Create cookbook namespace
  kubernetes.core.k8s:
    name: keittokirja
    api_version: v1
    kind: Namespace
    state: present

- name: Create cookbook DB credentials
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: keittokirja-db-app-creds
        namespace: keittokirja
      type: Opaque
      stringData:
        username: "{{ keittokirja_db_username }}"
        password: "{{ keittokirja_db_password }}"
        uri: "postgresql://{{ keittokirja_db_username | urlencode }}:{{ keittokirja_db_password | urlencode }}@keittokirja-db-rw.keittokirja.svc.cluster.local:5432/keittokirja"
  no_log: true

- name: Create bootstrap SQL secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: keittokirja-bootstrap
        namespace: keittokirja
      stringData:
        keittokirja_bootstrap.sql: "{{ lookup('file', keittokirja_bootstrap_sql_path) }}"
  no_log: true
