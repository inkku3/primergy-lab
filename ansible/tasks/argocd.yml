---
# All kubernetes.core.k8s tasks below explicitly set kubeconfig to the
# ansible user's kubeconfig path. Don't add "become: true"..

- name: Ensure kubernetes Python package is installed
  ansible.builtin.package:
    name: python3-kubernetes
    state: present
  become: true

- name: Create Argo CD namespace
  kubernetes.core.k8s:
    kubeconfig: /home/ansible/.kube/config
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd

- name: Create apps namespace
  kubernetes.core.k8s:
    kubeconfig: /home/ansible/.kube/config
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: apps

- name: Register GitHub repository with Argo CD
  kubernetes.core.k8s:
    kubeconfig: /home/ansible/.kube/config
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: primergy-lab-repo
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: https://github.com/inkku3/primergy-lab.git
        username: "{{ github_username }}"
        password: "{{ github_pat }}"
        # Same credential is reused by Image Updater for git write-back

- name: Create GHCR image pull secret
  kubernetes.core.k8s:
    kubeconfig: /home/ansible/.kube/config
    state: present
    namespace: apps
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-secret
        namespace: apps
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ lookup('template', 'dockerconfig.json.j2') | b64encode }}"

- name: Install Argo CD
  kubernetes.core.k8s:
    kubeconfig: /home/ansible/.kube/config
    state: present
    namespace: argocd
    src: https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.5/manifests/install.yaml

- name: Wait for Argo CD server deployment
  kubernetes.core.k8s_info:
    kubeconfig: /home/ansible/.kube/config
    api_version: apps/v1
    kind: Deployment
    namespace: argocd
    name: argocd-server
    wait: yes
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
