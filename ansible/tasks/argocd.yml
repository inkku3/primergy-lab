---
- name: Ensure kubernetes Python package is installed
  ansible.builtin.package:
    name: python3-kubernetes
    state: present
  become: true

- name: Register GitHub repository with Argo CD
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: github-repo
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: https://github.com/inkku3/primergy-lab.git
        username: "{{ github_username }}"
        password: "{{ github_pat }}"

- name: Create GitHub Secret for Image Pulling and Git Write-back
  kubernetes.core.k8s:
    kubeconfig: ~/.kube/config
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-secret
        namespace: argocd
      type: Opaque
      stringData:
        username: "{{ github_username }}"
        password: "{{ github_pat }}"

- name: Create GHCR image pull secret
  kubernetes.core.k8s:
    state: present
    namespace: apps
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ghcr-secret
        namespace: apps
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ lookup('template', 'dockerconfig.json.j2') | b64encode }}"

# 2. Argo CD namespace task does NOT use become: true
- name: Create Argo CD namespace
  kubernetes.core.k8s:
    kubeconfig: /home/ansible/.kube/config
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd

- name: Install Argo CD
  kubernetes.core.k8s:
    kubeconfig: /home/ansible/.kube/config
    state: present
    namespace: argocd
    src: https://raw.githubusercontent.com/argoproj/argo-cd/v2.10.4/manifests/install.yaml

- name: Wait for Argo CD server deployment
  kubernetes.core.k8s_info:
    kubeconfig: /home/ansible/.kube/config
    api_version: apps/v1
    kind: Deployment
    namespace: argocd
    name: argocd-server
    wait: yes
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
