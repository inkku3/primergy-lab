# ansible/tasks/k3s_agent.yml
- name: Check if k3s agent is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_agent_installed

- name: Install k3s agent and join cluster
  shell: >
    curl -sfL https://get.k3s.io |
    K3S_URL=https://{{ hostvars[groups['control_plane'][0]]['inventory_hostname'] }}:6443
    K3S_TOKEN={{ hostvars[groups['control_plane'][0]]['k3s_node_token'] }}
    sh -
  # finds first machine in ansible inventory, grab its hostname, point agent to port 6443
  when: not k3s_agent_installed.stat.exists # skip if k3s agent already installed
