# ansible/tasks/cloudflared.yml
- name: Remove conflicting legacy apt repository files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/cloudflared.list
    - /etc/apt/sources.list.d/cloudflare.list
    - /usr/share/keyrings/cloudflare-main.gpg

- name: Add cloudflared apt repository
  ansible.builtin.deb822_repository:
    name: cloudflared
    types: deb
    uris: https://pkg.cloudflare.com/cloudflared
    suites: noble
    components: main
    signed_by: https://pkg.cloudflare.com/cloudflare-main.gpg
    state: present
    
- name: Install cloudflared
  apt:
    name: cloudflared
    state: present
    update_cache: true
    cache_valid_time: 3600 # cache stays valid for one hour

- name: Ensure cloudflared config directory exists
  file:
    path: /etc/cloudflared
    state: directory
    mode: '0755'

- name: Install cloudflared service with token
  command: "cloudflared service install {{ cloudflare_tunnel_token }}"
  args:
    creates: /etc/systemd/system/cloudflared.service
  no_log: true # Hide token in output

- name: Enable and start cloudflared service
  systemd:
    name: cloudflared
    enabled: true
    state: started
