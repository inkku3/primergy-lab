# ansible/tasks/kubeconfig.yml
- name: Install kubectl
  get_url:
    url: "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: '0755'

- name: Read kubeconfig from control plane
  slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: kubeconfig_raw
  delegate_to: "{{ groups['control_plane'][0] }}"

- name: Ensure .kube directory exists
  file:
    path: /home/ansible/.kube
    state: directory
    owner: ansible
    group: ansible
    mode: '0700'

- name: Write kubeconfig, pointing at control plane IP
  copy:
    content: "{{ (kubeconfig_raw.content | b64decode) | regex_replace('127.0.0.1', groups['control_plane'][0]) }}"
    dest: /home/ansible/.kube/config
    owner: ansible
    group: ansible
    mode: '0600'
