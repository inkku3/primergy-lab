apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: dashboard-node-exporter-full
    files:
      - node-exporter-full.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: dashboard-kubernetes-views-global
    files:
      - kubernetes-views-global.json
    options:
      labels:
        grafana_dashboard: "1"
  - name: dashboard-argocd-overview
    files:
      - argocd-overview.json
    options:
      labels:
        grafana_dashboard: "1"

  #- name: dashboard-homelab-overview
  #  files:
  #    - homelab-overview.json
  #  options:
  #    labels:
  #      grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true    # keeps ConfigMap names stable across syncs
