apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: paper
spec:
  serviceName: paper
  replicas: 1
  selector:
    matchLabels:
      app: paper
  template:
    metadata:
      labels:
        app: paper
    spec:
      initContainers:
        - name: inject-discord-token
          image: busybox
          command:
            - sh
            - -c
            - |
              if [ -f /data/plugins/DiscordSRV/config.yml ]; then
                sed -i "s/^BotToken:.*/BotToken: \"$DISCORD_BOT_TOKEN\"/" /data/plugins/DiscordSRV/config.yml
              fi
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discordsrv-config
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest
          env:
            - name: PLUGINS
              value: "https://github.com/DiscordSRV/DiscordSRV/releases/download/v1.30.5/DiscordSRV-Build-1.30.5.jar"
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "PAPER"
            - name: MEMORY
              value: "2G"
            - name: MAX_PLAYERS
              value: "10"
            - name: MOTD
              value: "Primergy Lab"
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PORT
              value: "25575"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paper-rcon
                  key: password
          ports:
            - containerPort: 25565
              name: game
            - containerPort: 25575
              name: rcon
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
