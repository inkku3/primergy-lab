apiVersion: v1
kind: Service
metadata:
  name: paper
spec:
  type: LoadBalancer
  selector:
    app: paper
  ports:
    - name: game
      port: 25565
      targetPort: 25565
---
apiVersion: v1
kind: Service
metadata:
  name: paper-rcon
spec:
  type: ClusterIP
  selector:
    app: paper
  ports:
    - name: rcon
      port: 25575
      targetPort: 25575
