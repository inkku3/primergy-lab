apiVersion: v1
kind: Service
metadata:
  name: paper
spec:
  type: LoadBalancer
  selector:
    app: paper
  ports:
    - name: game
      port: 25555
      targetPort: 25565
---
apiVersion: v1
kind: Service
metadata:
  name: paper-rcon
spec:
  type: ClusterIP
  selector:
    app: paper
  ports:
    - name: rcon
      port: 25575
      targetPort: 25575
---
apiVersion: v1
kind: Service
metadata:
  name: squaremap
spec:
  type: ClusterIP
  selector:
    app: paper
  ports:
    - name: map
      port: 8080
      targetPort: 8080
