# cluster/apps/keittokirja/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keittokirja
  namespace: keittokirja
spec:
  rules:
    - host: keittokirja.inkku.xyz
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: keittokirja-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keittokirja-frontend
                port:
                  number: 80
