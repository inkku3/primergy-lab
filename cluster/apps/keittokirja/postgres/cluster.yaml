# cluster/apps/keittokirja/postgres/cluster.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keittokirja-db
  namespace: keittokirja
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: keittokirja
      owner: keittokirja
      secret:
        name: keittokirja-db-app-creds
      postInitApplicationSQLRefs:
        secretRefs:
        - name: keittokirja-bootstrap
          key: keittokirja_bootstrap.sql
