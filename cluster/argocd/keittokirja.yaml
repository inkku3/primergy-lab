# cluster/argocd/keittokirja.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keittokirja
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: backend=ghcr.io/inkku3/keittokirja-backend,frontend=ghcr.io/inkku3/keittokirja-frontend
    argocd-image-updater.argoproj.io/backend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/frontend.update-strategy: newest-build
    argocd-image-updater.argoproj.io/backend.allow-tags: "regexp:^sha-"
    argocd-image-updater.argoproj.io/frontend.allow-tags: "regexp:^sha-"
    argocd-image-updater.argoproj.io/pull-secret: pullsecret:argocd/ghcr-secret
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: kustomization
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/inkku3/primergy-lab.git
    targetRevision: main
    path: cluster/apps/keittokirja
  destination:
    server: https://kubernetes.default.svc
    namespace: keittokirja
  syncPolicy:
    automated: { prune: true, selfHeal: true }
