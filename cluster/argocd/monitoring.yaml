apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "87.21.0"
      helm:
        valueFiles:
          - $values/cluster/apps/monitoring/values.yaml

    - repoURL: https://github.com/inkku3/primergy-lab.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/inkku3/primergy-lab.git
      targetRevision: main
      path: cluster/apps/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
