apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: php-site
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: |
      php=ghcr.io/inkku3/primergy-lab-php,
      nginx=ghcr.io/inkku3/primergy-lab-nginx

    argocd-image-updater.argoproj.io/php.update-strategy: newest-build
    argocd-image-updater.argoproj.io/nginx.update-strategy: newest-build

    argocd-image-updater.argoproj.io/php.allow-tags: regexp:^[0-9a-f]{40}$
    argocd-image-updater.argoproj.io/nginx.allow-tags: regexp:^[0-9a-f]{40}$

    # Pull secret for GHCR
    argocd-image-updater.argoproj.io/pull-secret: secret:argocd/ghcr-secret

    # Write back to Git using the same secret for Git authentication
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/ghcr-secret

spec:
  project: default
  source:
    repoURL: https://github.com/inkku3/primergy-lab.git
    targetRevision: main
    path: cluster/apps/php-site/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
